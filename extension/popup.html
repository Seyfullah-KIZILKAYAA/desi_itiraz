<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
        color: #1c2430;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #c0392b; }
      .dot.on { background: #1f9254; }
      .dot.rec { background: #f27a1a; }
      .muted { color: #6b7684; font-size: 12px; }
      .hint {
        margin-top: 10px;
        padding: 8px 10px;
        background: #f6f7f9;
        border-radius: 5px;
        font-size: 12px;
        color: #6b7684;
      }
    </style>
  </head>
  <body>
    <h1>Desi İtiraz Köprüsü</h1>
    <div class="row"><span id="dot" class="dot"></span><span id="status">Kontrol ediliyor…</span></div>
    <div class="row muted" id="tab"></div>
    <div class="hint" id="hint"></div>
    <script src="popup.js"></script>
  </body>
</html>
